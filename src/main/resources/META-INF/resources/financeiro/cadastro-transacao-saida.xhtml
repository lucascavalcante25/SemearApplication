<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/layout.xhtml">
    <ui:define name="title">Cadastro de Saídas</ui:define>

    <ui:define name="head">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    </ui:define>

    <ui:define name="content">
        <div class="container-fluid px-4">
            <br />
            <h:form id="form-transacao">
                <div class="mb-3">
                    <label class="form-label">Descrição:</label>
                    <p:inputText value="#{transacaoSaidaBean.transacao.descricao}" styleClass="form-control" required="true" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Categoria:</label>
                    <p:selectOneMenu value="#{transacaoSaidaBean.transacao.categoria}" styleClass="form-control" required="true">
                        <f:selectItem itemLabel="Alimentação" itemValue="alimentacao" />
                        <f:selectItem itemLabel="Energia" itemValue="energia" />
                        <f:selectItem itemLabel="Água Bebedouro" itemValue="agua" />
                        <f:selectItem itemLabel="Limpeza" itemValue="limpeza" />
                        <f:selectItem itemLabel="Manutenção Predial" itemValue="manutencaoPredial" />
                        <f:selectItem itemLabel="Construção" itemValue="construcao" />
                        <f:selectItem itemLabel="Diversos" itemValue="diversos" />
                    </p:selectOneMenu>
                    <label class="form-label">Método de pagamento:</label>
                    <p:selectOneMenu value="#{transacaoSaidaBean.transacao.metodoDePagamento}" styleClass="form-control" required="true">
                        <f:selectItem itemLabel="Cartão de débito" itemValue="cartaoDebito" />
                        <f:selectItem itemLabel="Cartão de crédito" itemValue="cartaoCredito" />
                        <f:selectItem itemLabel="Pix" itemValue="pix" />
                        <f:selectItem itemLabel="Dinheiro" itemValue="dinheiro" />
                        <f:selectItem itemLabel="APP do Banco" itemValue="appBanco" />
                    </p:selectOneMenu>
                </div>
                <div class="mb-3">
                    <label class="form-label">Valor:</label>
                    <p:inputNumber value="#{transacaoSaidaBean.transacao.valor}" styleClass="form-control" required="true"
                                   decimalPlaces="2" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Data:</label>
                    <p:inputText value="#{transacaoSaidaBean.transacao.data}" styleClass="form-control" required="true" />
                </div>
                <p:commandButton value="Cadastrar" action="#{transacaoSaidaBean.salvar}" ajax="false"
                                 styleClass="btn btn-primary" />
                <button type="button" class="btn btn-secondary" onclick="limparCampos()">Limpar</button>
            </h:form>
            <br />
            <div>
                <h4>Transações de Saída</h4>
                <ul>
                    <ui:repeat value="#{transacaoSaidaBean.transacoes}" var="transacao">
                        <li>
                            <h:outputText value="#{transacao.data}" /> -
                            <h:outputText value="#{transacao.descricao}" /> -
                            <h:outputText value="#{transacao.categoria}" /> -
                            <h:outputText value="#{transacao.valor}" /> -
                            <h:outputText value="#{transacao.metodoDePagamento}" />
                        </li>
                    </ui:repeat>
                </ul>
            </div>
        </div>
    </ui:define>

    <ui:define name="scripts">
        <script src="#{request.contextPath}/js/scripts-transacao-saida.js"></script>
    </ui:define>
</ui:composition>

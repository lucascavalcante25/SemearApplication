<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/layout.xhtml">
    <ui:define name="title">Dashboard</ui:define>

    <ui:define name="content">
        <div class="container-fluid px-4">
            <h1 class="mt-4">Dashboard Financeiro</h1>
            <ol class="breadcrumb mb-4">
                <li class="breadcrumb-item active">Dashboard</li>
            </ol>
            <div class="row">
                <div class="col-xl-6">
                    <div class="card mb-4">
                        <div class="card-header">
                            <i class="fas fa-chart-bar me-1"></i>
                            Gráfico de Barras
                        </div>
                        <div class="card-body">
                            <canvas id="myBarChart" width="100%" height="40"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>

    <ui:define name="scripts">
        <h:outputScript target="body">
            var consolidadoEntrada = #{dashboardBean.consolidadoEntradaJson};
            var consolidadoSaida = #{dashboardBean.consolidadoSaidaJson};
            var saldoAcumulado = #{dashboardBean.saldoAcumuladoJson};
        </h:outputScript>
        <script src="#{request.contextPath}/js/dashboard.js"></script>
    </ui:define>
</ui:composition>

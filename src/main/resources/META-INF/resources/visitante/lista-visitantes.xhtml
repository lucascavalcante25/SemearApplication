<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/layout.xhtml">
    <ui:define name="title">Visitantes</ui:define>

    <ui:define name="head">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    </ui:define>

    <ui:define name="content">
        <br />
        <div class="container-fluid px-4">
            <div class="row">
                <div class="col">
                    <div class="card-body">
                        <button type="button" class="btn btn-success" id="btnCadastrar">
                            <i class="fas fa-list"></i> Novo
                        </button>
                        <div id="formularioContainer" style="display: none;">
                            <div class="container">
                                <div class="row">
                                    <div class="col">
                                        <div class="card-header card-title">
                                            <h3>Cadastrar visitante</h3>
                                        </div>
                                        <h:form>
                                            <div class="form-group">
                                                <label for="nome">Nome:</label>
                                                <p:inputText value="#{visitanteBean.visitante.nome}" styleClass="form-control" id="nome" />
                                            </div>
                                            <div class="form-group">
                                                <label for="congregacao">Congregação:</label>
                                                <p:inputText value="#{visitanteBean.visitante.congregacao}" styleClass="form-control" id="congregacao" />
                                            </div>
                                            <br />
                                            <p:commandButton value="Salvar" action="#{visitanteBean.salvar}" ajax="false"
                                                             styleClass="btn btn-success" icon="pi pi-save" />
                                            <button id="btnSairCadastro" type="button" class="btn btn-warning">
                                                <i class="fas fa-sign-out-alt"></i> Sair
                                            </button>
                                        </h:form>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <br /><br />
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <div class="card text-center">
                            <div class="card-header card-title">
                                <h3>Lista dos visitantes</h3>
                            </div>
                            <div class="table-responsive">
                                <table id="tabelaVisitantes" class="table table-striped">
                                    <thead>
                                    <tr>
                                        <th scope="col" style="width: 40%;">Nome</th>
                                        <th scope="col" style="width: 40%;">Congregação</th>
                                        <th scope="col" style="width: 20%;">Data da visita</th>
                                    </tr>
                                    </thead>
                                    <tbody id="myTable">
                                    <ui:repeat value="#{visitanteBean.visitantes}" var="visitante">
                                        <tr>
                                            <td><h:outputText value="#{visitante.nome}" /></td>
                                            <td><h:outputText value="#{visitante.congregacao}" /></td>
                                            <td><h:outputText value="#{visitante.data}" /></td>
                                        </tr>
                                    </ui:repeat>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>

    <ui:define name="scripts">
        <script src="#{request.contextPath}/js/scripts-visitantes.js"></script>
    </ui:define>
</ui:composition>

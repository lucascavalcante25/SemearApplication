<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/layout.xhtml">
    <ui:define name="title">Membros</ui:define>

    <ui:define name="head">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    </ui:define>

    <ui:define name="content">
        <br />
        <div class="container-fluid px-4">
            <div class="row">
                <div class="col">
                    <div class="card-body">
                        <div id="cadastroMembroForm" style="display: none;">
                            <h2>Formulário de Cadastro de Membro</h2>
                            <h:form>
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Nome Completo:</label>
                                        <p:inputText value="#{membroBean.membro.nomeCompleto}" styleClass="form-control" required="true" />
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">CPF:</label>
                                        <p:inputText value="#{membroBean.membro.cpf}" styleClass="form-control" id="campoCpf" required="true" />
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Gênero:</label>
                                        <p:selectOneMenu value="#{membroBean.membro.genero}" styleClass="form-control">
                                            <f:selectItem itemLabel="Selecione" itemValue="" />
                                            <f:selectItem itemLabel="Masculino" itemValue="Masculino" />
                                            <f:selectItem itemLabel="Feminino" itemValue="Feminino" />
                                        </p:selectOneMenu>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Data de Nascimento:</label>
                                        <p:inputText value="#{membroBean.membro.dataNascimento}" styleClass="form-control" id="campoData" />
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Endereço:</label>
                                        <p:inputText value="#{membroBean.membro.endereco}" styleClass="form-control" />
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Telefone:</label>
                                        <p:inputText value="#{membroBean.membro.telefone}" styleClass="form-control" id="campoTelefone" required="true" />
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Telefone para Emergência:</label>
                                        <p:inputText value="#{membroBean.membro.telefoneEmergencia}" styleClass="form-control" id="campoTelefoneEmergencia" required="true" />
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">E-mail:</label>
                                        <p:inputText value="#{membroBean.membro.email}" styleClass="form-control" />
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Data de Batismo:</label>
                                        <p:inputText value="#{membroBean.membro.dataBatismo}" styleClass="form-control" id="campoDataBatismo" />
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Cargo/Ministério:</label>
                                        <p:selectOneMenu value="#{membroBean.membro.cargoMinisterio}" styleClass="form-control">
                                            <f:selectItem itemLabel="Selecione" itemValue="" />
                                            <f:selectItem itemLabel="Pastor" itemValue="Pastor" />
                                            <f:selectItem itemLabel="Co-pastor" itemValue="Co-pastor" />
                                            <f:selectItem itemLabel="Membro(a)" itemValue="Membro" />
                                            <f:selectItem itemLabel="Ministro de Louvor" itemValue="Ministro de Louvor" />
                                            <f:selectItem itemLabel="Secretário(a)" itemValue="Secretário" />
                                            <f:selectItem itemLabel="Líder de Senhoras" itemValue="Líder de Senhoras" />
                                            <f:selectItem itemLabel="Líder de Casais" itemValue="Líder de Casais" />
                                            <f:selectItem itemLabel="Administrador" itemValue="Administrador" />
                                        </p:selectOneMenu>
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Estado Civil:</label>
                                        <p:selectOneMenu value="#{membroBean.membro.estadoCivil}" styleClass="form-control">
                                            <f:selectItem itemLabel="Selecione" itemValue="" />
                                            <f:selectItem itemLabel="Casado(a)" itemValue="Casado(a)" />
                                            <f:selectItem itemLabel="Divorciado(a)" itemValue="Divorciado(a)" />
                                            <f:selectItem itemLabel="Separado(a)" itemValue="Separado(a)" />
                                            <f:selectItem itemLabel="Solteiro(a)" itemValue="Solteiro(a)" />
                                            <f:selectItem itemLabel="Viuvo(a)" itemValue="Viuvo(a)" />
                                        </p:selectOneMenu>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Senha:</label>
                                        <p:password value="#{membroBean.membro.senha}" styleClass="form-control" />
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-12">
                                        <label class="form-label">Observações:</label>
                                        <p:inputTextarea value="#{membroBean.membro.observacoes}" styleClass="form-control" rows="4" />
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-md-12">
                                        <p:commandButton value="Salvar" action="#{membroBean.salvar}" ajax="false"
                                                         styleClass="btn btn-primary" />
                                        <button class="btn btn-secondary" type="button" onclick="ocultarFormCadastro()">Sair</button>
                                    </div>
                                </div>
                            </h:form>
                        </div>
                        <div id="botoesCadastro">
                            <button class="btn btn-success" type="button" onclick="mostrarFormCadastro()">Incluir Membro</button>
                        </div>
                        <br />
                        <input class="form-control" id="myInput" type="text" placeholder="Buscar membro na lista..." />
                        <br />
                    </div>
                </div>
                <div class="container">
                    <div class="row">
                        <div class="col">
                            <div class="card text-center">
                                <div class="card-header card-title">
                                    <h3>Lista de Membros</h3>
                                </div>
                                <div class="table-responsive">
                                    <h:form>
                                        <table id="tabelaMembros" class="table table-striped">
                                            <thead>
                                            <tr>
                                                <th>Nome Completo</th>
                                                <th>Gênero</th>
                                                <th>Data de Nascimento</th>
                                                <th>Endereço</th>
                                                <th>Telefone</th>
                                                <th>Telefone para Emergência</th>
                                                <th>E-mail</th>
                                                <th>Data de Batismo</th>
                                                <th>Cargo/Ministério</th>
                                                <th>Estado Civil</th>
                                                <th>Observações</th>
                                                <th>Ações</th>
                                            </tr>
                                            </thead>
                                            <tbody id="myTableMembro">
                                            <ui:repeat value="#{membroBean.membros}" var="membro">
                                                <tr>
                                                    <td><h:outputText value="#{membro.nomeCompleto}" /></td>
                                                    <td><h:outputText value="#{membro.genero}" /></td>
                                                    <td><h:outputText value="#{membro.dataNascimento}" /></td>
                                                    <td><h:outputText value="#{membro.endereco}" /></td>
                                                    <td><h:outputText value="#{membro.telefone}" /></td>
                                                    <td><h:outputText value="#{membro.telefoneEmergencia}" /></td>
                                                    <td><h:outputText value="#{membro.email}" /></td>
                                                    <td><h:outputText value="#{membro.dataBatismo}" /></td>
                                                    <td><h:outputText value="#{membro.cargoMinisterio}" /></td>
                                                    <td><h:outputText value="#{membro.estadoCivil}" /></td>
                                                    <td><h:outputText value="#{membro.observacoes}" /></td>
                                                    <td>
                                                        <h:commandLink action="#{membroBean.remover(membro.id)}"
                                                                       styleClass="waves-effect waves-light text-danger">
                                                            <i class="fas fa-trash-alt fa-lg"></i>
                                                        </h:commandLink>
                                                        <h:commandLink action="#{membroBean.editar(membro.id)}"
                                                                       styleClass="waves-effect waves-light text-primary">
                                                            <i class="fas fa-edit fa-lg"></i>
                                                        </h:commandLink>
                                                    </td>
                                                </tr>
                                            </ui:repeat>
                                            </tbody>
                                        </table>
                                    </h:form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>

    <ui:define name="scripts">
        <script src="#{request.contextPath}/js/scripts-lista-membros.js"></script>
    </ui:define>
</ui:composition>

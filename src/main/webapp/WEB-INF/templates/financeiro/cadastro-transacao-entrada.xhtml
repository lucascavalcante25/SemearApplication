<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://java.sun.com/jsf/facelets">
<h:head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Semear</title>
    <link rel="icon" type="image/png" href="#{resource['images/logoSemearSmall.png']}"/>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet"/>
    <link href="#{resource['css/styles.css']}" rel="stylesheet"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</h:head>
<h:body>
<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="content">
        <h1>Cadastro de Entrada Financeira</h1>
        <h:form>
            <p:panelGrid columns="2" styleClass="ui-panelgrid-blank">
                <h:outputLabel for="descricao" value="Descrição:"/>
                <p:inputText id="descricao" value="#{transacaoEntradaBean.transacao.descricao}" required="true"/>
                <h:outputLabel for="valor" value="Valor:"/>
                <p:inputNumber id="valor" value="#{transacaoEntradaBean.transacao.valor}" required="true"/>
                <h:outputLabel for="data" value="Data:"/>
                <p:calendar id="data" value="#{transacaoEntradaBean.transacao.data}" pattern="dd/MM/yyyy" showIcon="true"/>
            </p:panelGrid>
            <p:commandButton value="Salvar" action="#{transacaoEntradaBean.salvar}" update=":form"/>
            <p:button value="Voltar" outcome="dashboard.xhtml"/>
        </h:form>
    </ui:define>
</ui:composition>
</h:body>
</html>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://java.sun.com/jsf/facelets">
<h:head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Semear</title>
    <link rel="icon" type="image/png" href="#{resource['images/logoSemearSmall.png']}"/>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet"/>
    <link href="#{resource['css/styles.css']}" rel="stylesheet"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
</h:head>
<h:body>
<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="content">
        <h1>Lista de Avisos</h1>
        <p:dataTable value="#{avisoBean.avisos}" var="aviso" paginator="true" rows="10" responsiveLayout="scroll">
            <p:column headerText="Título">
                <h:outputText value="#{aviso.titulo}"/>
            </p:column>
            <p:column headerText="Descrição">
                <h:outputText value="#{aviso.descricao}"/>
            </p:column>
            <p:column headerText="Data">
                <h:outputText value="#{aviso.data}"/>
            </p:column>
            <p:column headerText="Ações">
                <p:button value="Editar" outcome="update-aviso.xhtml">
                    <f:param name="id" value="#{aviso.id}"/>
                </p:button>
            </p:column>
        </p:dataTable>
    </ui:define>
</ui:composition>
</h:body>
</html>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://java.sun.com/jsf/facelets">
<h:head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>App Semear</title>
    <link href="#{resource['bootstrap/css/bootstrap.min.css']}" rel="stylesheet"/>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous"/>
</h:head>
<h:body>
<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="content">
        <h1>Cadastrar/Editar Louvor</h1>
        <h:form>
            <p:panelGrid columns="2" styleClass="ui-panelgrid-blank">
                <h:outputLabel for="nome" value="Nome:"/>
                <p:inputText id="nome" value="#{louvorBean.louvor.nome}" required="true"/>
                <h:outputLabel for="grupo" value="Grupo:"/>
                <p:inputText id="grupo" value="#{louvorBean.louvor.grupo}" required="true"/>
                <h:outputLabel for="ativo" value="Ativo:"/>
                <p:selectBooleanCheckbox id="ativo" value="#{louvorBean.louvor.ativo}"/>
            </p:panelGrid>
            <p:commandButton value="Salvar" action="#{louvorBean.salvar}" update=":form"/>
            <p:button value="Voltar" outcome="lista-louvor.xhtml"/>
        </h:form>
    </ui:define>
</ui:composition>
</h:body>
</html>

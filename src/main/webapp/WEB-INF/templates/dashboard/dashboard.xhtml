<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://java.sun.com/jsf/facelets">
<h:head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Semear</title>
    <link rel="icon" type="image/png" href="#{resource['images/logoSemearSmall.png']}"/>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet"/>
    <link href="#{resource['css/styles.css']}" rel="stylesheet"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</h:head>
<h:body>
<ui:composition template="/WEB-INF/templates/layout.xhtml">
    <ui:define name="content">
        <h1>Dashboard Financeiro</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item active">Gráfico mês a mês entradas, saídas e saldo final em caixa.</li>
        </ol>
        <div class="row">
            <div class="col-xl-12">
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-chart-bar me-1"></i> Gráfico de Barras
                    </div>
                    <div class="card-body">
                        <canvas id="myBarChart" width="100%" height="40"></canvas>
                        <script type="text/javascript">
                            var consolidadoEntrada = #{dashboardBean.consolidadoEntrada};
                            var consolidadoSaida = #{dashboardBean.consolidadoSaida};
                            var saldoAcumulado = #{dashboardBean.saldoAcumulado};
                        </script>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>
</ui:composition>
</h:body>
</html>
